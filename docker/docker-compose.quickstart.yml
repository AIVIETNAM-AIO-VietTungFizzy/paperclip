services:
  paperclip:
    image: paperclip:latest
    ports:
      - "3100:3100"
    environment:
      HOST: "0.0.0.0"
      PORT: "3100"
      SERVE_UI: "true"
      PAPERCLIP_HOME: "/paperclip"
      PAPERCLIP_DEPLOYMENT_MODE: "local_trusted"

    volumes:
      - paperclip-data:/paperclip

volumes:
  paperclip-data: